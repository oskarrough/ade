<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>arbe desktop</title>
		<style>
			:root {
				color-scheme: light dark;
				font:
					15px/1.5 system-ui,
					sans-serif;
				background: light-dark(#fff, #121212);
				color: light-dark(#111, #eee);
			}
			body {
				margin: 0;
				height: 100vh;
				display: grid;
				place-content: center;
				padding: 0 1.5rem;
				--app-region: drag;
			}
			main {
				max-width: 26rem;
				--app-region: no-drag;
			}
			h1 {
				font-size: 1.1rem;
				font-weight: 600;
				margin: 0 0 0.25rem;
				display: flex;
				align-items: center;
				gap: 0.6rem;
			}
			h1::before {
				content: '';
				width: 0.55rem;
				height: 0.55rem;
				border-radius: 50%;
				background: #e8a33d;
				animation: pulse 1.6s ease-in-out infinite;
			}
			@keyframes pulse {
				50% {
					opacity: 0.25;
				}
			}
			p {
				margin: 0;
				color: light-dark(#666, #999);
			}
			code {
				color: light-dark(#111, #eee);
			}
			details {
				margin-top: 2rem;
				color: light-dark(#666, #999);
			}
			summary {
				cursor: pointer;
				font-size: 0.85rem;
			}
			form {
				display: flex;
				gap: 0.5rem;
				margin-top: 0.75rem;
			}
			input,
			button {
				font: inherit;
				border-radius: 0.5rem;
				border: 1px solid light-dark(#ccc, #333);
				padding: 0.35rem 0.6rem;
				background: light-dark(#f2f2f2, #1d1d1d);
				color: inherit;
			}
			input {
				flex: 1;
				min-width: 0;
			}
			button {
				cursor: pointer;
			}
			.house:empty {
				display: none;
			}
			.house {
				margin-top: 0.5rem;
			}
			.actions {
				margin-top: 1rem;
			}
			output {
				display: block;
				margin-top: 0.5rem;
				color: #d55;
				font-size: 0.85rem;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Can't reach ade</h1>
			<p>
				Nothing answers at <code>{{server}}</code>. Trying again every few seconds; the page comes
				back by itself.
			</p>
			<p class="house">{{house}}</p>
			<p class="actions"><button type="button" id="try">Try now</button></p>
			<details>
				<summary>Use another server</summary>
				<form>
					<input name="server" value="{{server}}" spellcheck="false" aria-label="Server address" />
					<button>Connect</button>
				</form>
				<output></output>
			</details>
		</main>
		<script>
			document.querySelector('#try').addEventListener('click', () => mygo.call('Desktop.TryNow'))
			document.querySelector('form').addEventListener('submit', (event) => {
				event.preventDefault()
				const out = document.querySelector('output')
				out.textContent = ''
				mygo.call('Desktop.SetServer', event.target.server.value).catch((error) => {
					out.textContent = error.message ?? String(error)
				})
			})
		</script>
	</body>
</html>
